name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только один деплой, новый заменяет ожидающий
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия pnpm берётся из поля packageManager в package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build control app
        run: pnpm --filter control build
        env:
          # Сайт будет доступен по https://<user>.github.io/<имя репозитория>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Адрес бэка хранится в секрете репозитория (Settings → Secrets and variables → Actions)
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Боевая сборка работает с настоящим бэком (демо-режим на моках выключен).
          # Для показа без сервера переменную можно переопределить: Settings → Secrets and variables →
          # Actions → Variables → VITE_USE_MOCK = true.
          VITE_USE_MOCK: ${{ vars.VITE_USE_MOCK || 'false' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/control/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
